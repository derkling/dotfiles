# ~/.config/yazi/yazi.toml - Yazi Configuration

[manager]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true
linemode       = "size"

[opener]
edit = [
	{ run = '${EDITOR:-vi} "$@"', block = true,  desc = "Edit with Editor" },
]
zathura = [
	{ run = 'zathura "$@"', block = false, desc = "Open with Zathura" },
]

[open]
prepend_rules = [
	{ name = "*.pdf", use = "zathura" },
	{ mime = "text/*", use = "edit" },
]

[preview]
tab_size        = 2
max_width       = 600
max_height      = 900
image_filter    = "triangle"
image_quality   = 75
# Ensure pdftoppm is used for PDF
# (Standard in modern Yazi if poppler-utils is installed)
